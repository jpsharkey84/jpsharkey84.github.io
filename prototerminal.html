    :root {
      --win-top: #1a2b6d;
      --win-bot: #070d29;
      --win-border: #d8e4ff;
      --win-inner: #4d6bb3;
      --accent: #38bdf8;
      --gold: #fcd34d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030612 75%);
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }

    .rpg-win {
      background: linear-gradient(180deg, var(--win-top) 0%, var(--win-bot) 100%);
      border: 2px solid var(--win-border);
      box-shadow: inset 0 0 0 2px var(--win-inner), 0 12px 30px rgba(0, 0, 0, 0.62);
      border-radius: 8px;
    }
    .rpg-sub {
      background: rgba(3, 7, 20, 0.65);
      border: 1px solid rgba(216, 228, 255, 0.25);
      border-radius: 6px;
    }

    @keyframes cursorBob {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(3px); }
    }
    .rpg-cursor {
      display: inline-block;
      animation: cursorBob 0.85s infinite ease-in-out;
      color: var(--gold);
    }

    .list-row {
      transition: background 0.14s ease, border-color 0.14s ease;
      border: 1px solid transparent;
    }
    .list-row:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(216, 228, 255, 0.28);
    }
    .list-row.selected {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.2) 0%, rgba(16, 25, 53, 0.5) 100%);
      border-color: var(--accent);
    }

    .tab-btn.active {
      background: rgba(252, 211, 77, 0.18);
      border-color: var(--gold);
      color: #ffffff;
    }

    .diffuser-grid {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px);
      background-size: 6px 6px;
      backdrop-filter: blur(5px);
    }
    .caustic-aura { transition: background 0.4s ease, opacity 0.4s ease; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.16);
      height: 6px;
      border-radius: 999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid #ffffff;
      cursor: pointer;
    }
  </style>
</head>
